<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusEats | Create account</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="register">
    <nav class="top-nav">
      <div class="nav-brand">CampusEats</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="catalog.html">Catalogue</a>
        <a href="cart.html">Cart</a>
        <a href="orders.html">Orders</a>
        <a href="login.html">Login</a>
      </div>
      <div class="nav-user" id="navUser">Guest</div>
    </nav>

    <main class="page-shell narrow-shell">
      <section class="panel auth-card">
        <div class="panel-header">
          <h2>Create your student account</h2>
        </div>

        <form id="registerForm" class="stacked-form">
          <label>
            <span>Full name</span>
            <input type="text" name="full_name" autocomplete="name" maxlength="150" required />
          </label>
          <label>
            <span>Email</span>
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <label>
            <span>Phone <small>(optional)</small></span>
            <input type="tel" name="phone" autocomplete="tel" maxlength="30" />
          </label>
          <label>
            <span>Password</span>
            <input type="password" name="password" autocomplete="new-password" minlength="8" required />
          </label>
          <label>
            <span>Confirm password</span>
            <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required />
          </label>
          <button type="submit">Create account</button>
        </form>

        <p class="muted-note">Already registered? <a href="login.html">Log in</a>.</p>
        <div id="registerStatus" class="status-box info" role="status" aria-live="polite">Enter your details to get started.</div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
