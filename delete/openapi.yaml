openapi: 3.1.0
info:
  title: CampusEats Orders API
  version: 1.0.0
  description: |
    Assignment 6 status, validation, and content-negotiation contract for the existing Orders service.
    Stable problem types include empty-cart, item-unavailable, payment-declined,
    order-not-found, illegal-transition, validation-failed, rate-limited,
    not-acceptable, internal-error, and service-unavailable. Their identifiers
    use stable plain slugs such as `empty-cart` and `validation-failed` (not credentials).
servers:
  - url: http://localhost:8000
paths:
  /orders:
    post:
      summary: Create an order
      description: Invalid input is rejected before database writes or idempotency-key use. Supply the key in the header or request body.
      tags: [Orders]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
            examples:
              create:
                value:
                  user_id: 14
                  items:
                    - item_id: 1
                      qty: 1
                  location_id: 1
                  payment_method_id: 1
                  fulfilment_type: PICKUP
      responses:
        '201':
          description: Order created or idempotency replay returned.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          description: One or more requested items are unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Empty cart or field validation failure.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /orders/{order_id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/Authorization'
    get:
      summary: Read an order
      tags: [Orders]
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          required: false
          description: Missing or */* selects JSON; application/xml selects XML.
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Order representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
            application/xml:
              schema:
                $ref: '#/components/schemas/OrderXml'
        '304':
          description: The If-None-Match validator matches the current representation.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      summary: Replace an order status
      tags: [Orders]
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Order status replaced.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/IllegalTransition'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      summary: Partially update an order status
      tags: [Orders]
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Order status updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/IllegalTransition'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      summary: Cancel an order
      description: Soft-cancels a pending or placed order; repeating DELETE for an already-cancelled order returns 204.
      tags: [Orders]
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Order cancelled, or was already cancelled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/IllegalTransition'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /orders/cart/items:
    post:
      summary: Add an item to the cart
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, item_id, quantity]
              properties:
                user_id:
                  type: integer
                  minimum: 1
                item_id:
                  type: integer
                  minimum: 1
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Cart item added.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          description: Item is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /orders/{order_id}/cancel:
    post:
      summary: Cancel an order using the legacy cancellation action
      tags: [Orders]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Authorization'
        - name: user_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Order cancelled or already cancelled.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/IllegalTransition'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Authorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
        pattern: '^Bearer .+$'
  headers:
    Location:
      description: Relative URI of the created order.
      schema:
        type: string
        example: /orders/42
    ETag:
      description: Validator for conditional reads and writes.
      schema:
        type: string
    RetryAfter:
      description: Minimum number of seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Malformed JSON.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    Unauthorized:
      description: Bearer authorization is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    OrderNotFound:
      description: The requested order does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotAcceptable:
      description: No supported representation was requested.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    IllegalTransition:
      description: Requested status change or cancellation is not allowed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionFailed:
      description: If-Match does not match the current order ETag.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationFailed:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    RateLimited:
      description: Rate limit exceeded; wait before retrying.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalError:
      description: Unexpected server failure. Internal details are not returned.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: Temporary database or service failure; wait before retrying.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
    OrderCreate:
      type: object
      required: [user_id, items, address, payment_method_id, fulfilment_type]
      properties:
        user_id:
          type: integer
          minimum: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        location_id:
          type: integer
          minimum: 1
          description: Existing saved campus location ID, used for delivery fulfillment.
        address:
          type: string
          minLength: 1
          description: Required non-empty campus address or pickup description.
        payment_method_id:
          type: integer
          minimum: 1
        fulfilment_type:
          type: string
          enum: [PICKUP, DELIVERY]
        scheduled_at:
          type: string
          format: date-time
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 100
    OrderItem:
      type: object
      required: [item_id]
      properties:
        item_id:
          type: integer
          minimum: 1
        qty:
          type: integer
          minimum: 1
          description: Preferred field name. The legacy quantity field is also accepted.
        quantity:
          type: integer
          minimum: 1
          deprecated: true
          description: Legacy alias for qty.
      oneOf:
        - required: [qty]
        - required: [quantity]
    OrderStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING_PAYMENT, PLACED, ACCEPTED, PREPARING, READY, OUT_FOR_DELIVERY, READY_FOR_PICKUP, COMPLETED, CANCELLED]
    Order:
      type: object
      required: [order_id, user_id, restaurant_id, fulfilment_type, status, subtotal, total]
      properties:
        order_id:
          type: integer
        user_id:
          type: integer
        restaurant_id:
          type: integer
        location_id:
          type: [integer, 'null']
        fulfilment_type:
          type: string
        scheduled_at:
          type: [string, 'null']
          format: date-time
        status:
          type: string
        subtotal:
          type: number
        total:
          type: number
    OrderXml:
      type: string
      example: <order><order_id>42</order_id><status>PENDING_PAYMENT</status></order>
